:root[data-theme="dark"] { color-scheme: dark; }
[data-hue=o] { --hc: var(--o); --mx: 62%; } [data-hue=y] { --hc: var(--y); --mx: 74%; }
.mini-n[data-hue=y], .mini-c[data-hue=y], .mem-ini { --cell-fg: #1b1608; }
.cell[data-hue=y], .pbar[data-hue=y] .pb-n { --cell-fg: #fff; text-shadow: 0 1px 2px rgba(70, 48, 0, .45), 0 0 10px rgba(70, 48, 0, .25); } [data-hue=b] { --hc: var(--b); --mx: 60%; } [data-hue=l] { --hc: var(--l); --mx: 40%; } [data-hue=p] { --hc: var(--p); --mx: 58%; } [data-hue=s] { --hc: var(--s); --mx: 36%; }
html { scroll-behavior: auto; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 17px/1.55 var(--f-b); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
/* véu de granulado: textura pronta, sem mix-blend-mode na tela inteira (escuro: claro/escuro em alfa; claro: equivale ao multiply) */
body::before { content: ""; position: fixed; inset: 0; z-index: 90; pointer-events: none; background-image: var(--veil); opacity: var(--veil-op); }
*, *::before, *::after { box-sizing: border-box; }
a { color: inherit; } img { display: block; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--o); outline-offset: 3px; border-radius: 6px; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 200; background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; } .skip:focus { top: 8px; }
h1, h2, h3, h4, h5 { font-family: var(--f-d); font-weight: 700; line-height: 1.04; letter-spacing: -.02em; text-wrap: balance; margin: 0; }
p { margin: 0 0 .9em; max-width: 68ch; } .note { font-size: .85rem; color: var(--mute); max-width: 70ch; }
abbr { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; -webkit-tap-highlight-color: transparent; }
.wrap { width: 100%; max-width: 1140px; margin-inline: auto; padding-inline: var(--g); }
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; max-width: none; }

/* ===== topo ===== */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px var(--g); background: linear-gradient(var(--bg) 40%, transparent); backdrop-filter: blur(6px); -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.top.home .btn { pointer-events: auto; }
.top.home { position: absolute; left: 0; right: 0; background: none; backdrop-filter: none; -webkit-mask-image: none; mask-image: none; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 700 1.05rem/1 var(--f-d); }
.brand small { display: block; font: 500 .72rem var(--f-b); color: var(--mute); margin-top: 3px; }
.brand-m { width: 30px; height: 30px; border-radius: 58% 42% 55% 45% / 48% 56% 44% 52%; background: radial-gradient(circle at 30% 25%, var(--o), transparent 60%), radial-gradient(circle at 75% 75%, var(--b), transparent 62%), var(--bg2); box-shadow: 0 0 18px -2px color-mix(in oklab, var(--o) 60%, transparent); }
.top-nav { display: flex; align-items: center; gap: 6px; }
.tnl { text-decoration: none; padding: 8px 12px; border-radius: 999px; font-size: .9rem; } .tnl:hover { background: var(--card2); }
.ic { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
.ic:hover { background: var(--card2); } .ic.txt { width: auto; padding: 0 12px; border-radius: 999px; font-size: .8rem; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--fg); color: var(--bg); font-weight: 600; text-decoration: none; cursor: pointer; }
.btn.ghost { background: var(--card); color: var(--fg); } .btn.ghost:hover { background: var(--card2); } .btn.small { padding: 7px 13px; font-size: .86rem; } .btn[aria-pressed=true] { background: var(--fg); color: var(--bg); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: .9rem; line-height: 1.3; text-decoration: none; cursor: default; }
button.chip, .chip-link, .btnchip { cursor: pointer; } button.chip:hover, .chip-link:hover { background: var(--card2); }
.chip-link { border-color: color-mix(in oklab, var(--hc) 60%, transparent); } .chip-link::after { content: "→"; color: var(--hc); }
.btnchip[aria-pressed=true] { background: var(--fg); color: var(--bg); }
.chips { list-style: none; margin: 0 0 1em; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chips.soft .chip { background: color-mix(in oklab, var(--hc, var(--fg)) 14%, var(--bg)); border-color: transparent; }
.chips.stack { flex-direction: column; } .chips.stack .chip { border-radius: 14px; width: 100%; }

/* ===== home ===== */
.hero { position: relative; isolation: isolate; overflow: clip; }
.hero::before { content: ""; position: absolute; inset: -10% -10% auto; height: 120%; z-index: -2; background:
  radial-gradient(40% 36% at 14% 26%, color-mix(in oklab, var(--o) 38%, transparent), transparent 70%),
  radial-gradient(46% 40% at 40% 56%, color-mix(in oklab, var(--b) 36%, transparent), transparent 70%),
  radial-gradient(38% 34% at 76% 60%, color-mix(in oklab, var(--l) 24%, transparent), transparent 70%),
  radial-gradient(34% 30% at 92% 16%, color-mix(in oklab, var(--p) 32%, transparent), transparent 70%); filter: blur(30px); }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background-image: var(--grain); opacity: .28; mix-blend-mode: var(--grain-blend); -webkit-mask-image: linear-gradient(#000, transparent 96%); mask-image: linear-gradient(#000, transparent 96%); pointer-events: none; }
.hero-top { position: absolute; top: 62px; left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-inline: var(--g); pointer-events: none; }
.hero-top > * { pointer-events: auto; }
.hero-p { margin: 0; font-size: .95rem; color: var(--mute); max-width: 26ch; }
.hero-wm { position: absolute; z-index: -1; left: 0; right: 0; top: 0; bottom: 0; display: grid; place-items: center; pointer-events: none; overflow: hidden; }
.hero-wm h1 { font: 800 clamp(90px, 22vw, 340px)/.84 var(--f-d); font-stretch: 75%; letter-spacing: -.05em; text-align: center; color: transparent; -webkit-text-stroke: 1.5px color-mix(in oklab, var(--fg) 30%, transparent); margin: 0; background: linear-gradient(transparent 20%, color-mix(in oklab, var(--fg) 10%, transparent)); -webkit-background-clip: text; background-clip: text; }
.hero-wm h1 em { display: block; font-style: normal; }
.neb { position: relative; width: 100%; --u: 1; }
.neb-edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.neb-edges line { stroke: var(--edge); stroke-width: 1; transition: stroke .25s, stroke-width .25s; }
.neb-edges line.on { stroke: var(--fg); stroke-width: 1.8; }
.neb.has-active .neb-edges line:not(.on) { opacity: .35; }
.cell { position: absolute; left: 0; top: 0; display: block; width: max-content; font-size: calc(var(--fs) * var(--u)); max-width: var(--mw); min-width: min-content; padding: 1.05em 1.4em; border-radius: var(--shape); color: var(--cell-fg); text-decoration: none; line-height: 1.06; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: pointer; scale: 1; transition: scale .35s cubic-bezier(.2, .8, .2, 1.2), opacity .3s, filter .3s, box-shadow .3s;
  background: radial-gradient(120% 110% at 18% 8%, color-mix(in oklab, var(--hc) 100%, #fff 6%) 0%, transparent 62%), var(--grain), color-mix(in oklab, var(--hc) calc(var(--mx) * var(--mxl)), var(--bg));
  background-blend-mode: normal, soft-light, normal; box-shadow: 0 0 0 1px color-mix(in oklab, var(--hc) 40%, transparent) inset, 0 18px 50px -18px color-mix(in oklab, var(--hc) 70%, transparent); }
.cell.k-hub { --fs: 31px; --mw: 7.6em; } .cell.k-main { --fs: 21px; --mw: 8.6em; } .cell.k-sub { --fs: 16px; --mw: 8.3em; }
.cell-in { display: block; animation: bob var(--fd) ease-in-out var(--fl) infinite alternate; }
.cell-n { display: block; font: 600 .72em var(--f-d); opacity: .75; margin-bottom: .3em; }
.cell-t { display: block; font: 700 1em/1.06 var(--f-d); letter-spacing: -.015em; }
.cell.k-hub .cell-t { font-weight: 800; font-stretch: 85%; }
@keyframes bob { from { transform: translate(0, -2px) rotate(-.4deg); } to { transform: translate(1px, 3px) rotate(.5deg); } }
.cell:hover, .cell:focus-visible, .cell.is-on { scale: 1.1; z-index: 4; box-shadow: 0 0 0 1.5px var(--fg) inset, 0 20px 70px -10px color-mix(in oklab, var(--hc) 90%, transparent); }
.cell.is-nb { z-index: 3; box-shadow: 0 0 0 1.5px color-mix(in oklab, var(--fg) 60%, transparent) inset, 0 18px 56px -12px color-mix(in oklab, var(--hc) 80%, transparent); }
.cell.drag { cursor: grabbing; }
.neb.has-active .cell:not(.is-on):not(.is-nb) { opacity: .36; filter: saturate(.55); }
.neb-info:not(.has) { display: none; }
.neb-info-w { position: sticky; bottom: 0; height: 0; z-index: 8; }
.neb-info { position: absolute; left: var(--g); bottom: 18px; width: min(430px, calc(100vw - 2 * var(--g))); display: flex; flex-direction: column; gap: 5px; padding: 12px 15px; border-radius: 18px; background: color-mix(in oklab, var(--bg) 78%, transparent); backdrop-filter: blur(14px); border: 1px solid var(--line); font-size: .92rem; }
.neb-info b { font: 700 1.05rem var(--f-d); color: var(--hc); } .neb-c { color: var(--mute); font-size: .82rem; } .neb-info .go { align-self: flex-start; margin-top: 4px; }
.neb-hint { margin: 0; color: var(--mute); font-size: .85rem; }
.scrollhint { position: absolute; right: var(--g); bottom: 16px; z-index: 6; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: .85rem; color: var(--mute); padding: 8px 12px; border-radius: 999px; background: color-mix(in oklab, var(--bg) 70%, transparent); }

.g-steps li:nth-child(2) .g-n { background-color: color-mix(in oklab, var(--b) 68%, var(--bg)); } .g-steps li:nth-child(3) .g-n { background-color: color-mix(in oklab, var(--l) 46%, var(--bg)); } .g-steps li:nth-child(4) .g-n { background-color: color-mix(in oklab, var(--p) 62%, var(--bg)); }
.g-steps strong { font: 700 1.25rem var(--f-d); } .g-steps p { margin: 4px 0 0; color: var(--mute); }
.legend { margin: 36px 0; padding: 20px; border-radius: 22px; background: var(--card); } .legend h3 { font-size: 1.1rem; margin-bottom: 12px; }
.legend ul { list-style: none; padding: 0; margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 10px 20px; } .legend li { display: flex; align-items: center; gap: 8px; font-size: .92rem; }
.legend i { width: 20px; height: 20px; border-radius: 55% 45% 50% 50%; background: var(--grain), color-mix(in oklab, var(--hc) calc(var(--mx) * var(--mxl)), var(--bg)); background-blend-mode: soft-light, normal; box-shadow: 0 0 0 1px color-mix(in oklab, var(--hc) 50%, transparent) inset; }
.edits { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 14px; } .edits summary { cursor: pointer; font: 700 1.05rem var(--f-d); } .edits ul { margin: 12px 0 0; padding-left: 1.1em; display: grid; gap: 8px; color: var(--mute); font-size: .93rem; }
.foot { margin-top: 36px; font-size: .85rem; color: var(--mute); }

/* ===== página ===== */

.crumb { margin: 0 0 18px; font-size: .88rem; color: var(--mute); } .crumb a { text-decoration: none; } .crumb a:hover { text-decoration: underline; }
.phero-n { font: 800 clamp(110px, 24vw, 280px)/.8 var(--f-d); font-stretch: 75%; letter-spacing: -.05em; color: transparent; -webkit-text-stroke: 1.5px color-mix(in oklab, var(--hc) 80%, var(--fg)); opacity: .8; margin: 0 0 -.12em -.04em; -webkit-mask-image: linear-gradient(#000 40%, transparent); mask-image: linear-gradient(#000 40%, transparent); }
.phero h1 { font-size: clamp(2.3rem, 7vw, 5.2rem); font-stretch: 85%; font-weight: 800; max-width: 16ch; text-wrap: balance; outline: none; }
.lede { font-size: clamp(1.1rem, 2.2vw, 1.4rem); line-height: 1.4; max-width: 56ch; margin: 22px 0 22px; }
.toc { display: flex; flex-wrap: wrap; gap: 8px; max-width: 70ch; }
.body { padding-bottom: 20px; }
.sec { padding-block: clamp(30px, 5vw, 56px); border-top: 1px solid var(--line); scroll-margin-top: 70px; }
.sec > h2 { font-size: clamp(1.6rem, 3.6vw, 2.6rem); margin-bottom: 22px; font-stretch: 88%; }
.sec > * { margin-bottom: 1.2rem; } .sec h3 { font-size: 1.3rem; margin: 26px 0 12px; } .sec h4 { font-size: 1.1rem; } .sec h5 { font: 700 .95rem var(--f-d); margin: 16px 0 6px; color: var(--hc); }
.list { padding-left: 1.2em; display: grid; gap: .5em; max-width: 68ch; }
.callout { padding: 20px 22px; border-radius: 20px; max-width: 72ch; position: relative; background: radial-gradient(120% 100% at 0 0, color-mix(in oklab, var(--hc, var(--fg)) 22%, transparent), transparent 70%), var(--card); border: 1px solid color-mix(in oklab, var(--hc, var(--fg)) 40%, var(--line)); font-size: 1.05rem; }
.callout p:last-child { margin: 0; } .callout-t { display: block; font: 700 .9rem var(--f-d); margin-bottom: 6px; color: var(--hc); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; max-width: none; }
.fact { padding: 18px; border-radius: 20px; background: radial-gradient(100% 90% at 0 0, color-mix(in oklab, var(--hc, var(--fg)) 28%, transparent), transparent 75%), var(--card); min-width: 0; }
.fact-v { font: 800 clamp(2rem, 5vw, 3rem)/.95 var(--f-d); font-stretch: 80%; letter-spacing: -.03em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; } .fact-l { margin-top: 6px; font-size: .92rem; line-height: 1.25; } .fact-s { font-size: .78rem; color: var(--mute); margin-top: 2px; }

.card:hover { transform: translateY(-3px); background: radial-gradient(110% 90% at 0 0, color-mix(in oklab, var(--hc) 44%, transparent), transparent 72%), var(--card2); }
.card-n { font: 800 .9rem var(--f-d); color: var(--hc); } .card strong { font: 700 1.2rem/1.1 var(--f-d); } .card > span:not(.card-n):not(.card-a) { font-size: .88rem; color: var(--mute); } .card-a { margin-top: auto; align-self: flex-end; }
.trio { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; max-width: none; } .trio-i { padding: 18px; border-radius: 20px; background: var(--card); } .trio-i b { font: 700 1.05rem var(--f-d); color: var(--o); } .trio-i p { margin: 6px 0 0; }

/* conexões e pager */

.cx a { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; grid-template-areas: "n t a" "n w a"; column-gap: 12px; align-items: center; padding: 12px 16px; border-radius: 16px; text-decoration: none; background: var(--card); border-left: 4px solid var(--hc); transition: background .2s, transform .2s; }
.cx a:hover { background: var(--card2); transform: translateX(3px); } .cx-n { grid-area: n; font: 800 1.15rem var(--f-d); color: var(--hc); } .cx-t { grid-area: t; font: 700 1.05rem var(--f-d); } .cx-w { grid-area: w; font-size: .85rem; color: var(--mute); } .cx-a { grid-area: a; }

/* ===== abas, QA, timeline ===== */

.tab { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 600; } .tab:hover { background: var(--card2); }
.tab[aria-selected=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); } .tab-n { font: 800 .8rem var(--f-d); margin-right: 8px; opacity: .7; }
.tabpanel { padding: 22px; border-radius: 22px; background: var(--card); min-height: 90px; } .tabpanel > *:last-child { margin-bottom: 0; }
.swap { animation: swap .38s ease both; } @keyframes swap { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.qa { display: grid; gap: 8px; max-width: none; } .qa-bar { display: flex; justify-content: flex-end; }
.qa-i { border-radius: 18px; background: var(--card); border: 1px solid transparent; transition: border-color .2s, background .2s; } .qa-i[open] { background: var(--card2); border-color: var(--line); }

.qa-a { padding: 4px 20px 22px 68px; } .qa-a > *:last-child { margin-bottom: 0; }

.tl-rail { display: flex; gap: 0; position: relative; min-width: max-content; }
.tl-rail::before { content: ""; position: absolute; left: 0; right: 0; top: 46px; height: 2px; background: var(--line); }
.tl-dot { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 0 22px 0 0; min-width: 118px; background: none; border: 0; cursor: pointer; text-align: left; color: var(--mute); }
.tl-dot::before { content: ""; order: 2; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 2px solid var(--mute); margin: 7px 0 9px; position: relative; z-index: 1; transition: .25s; }
.tl-y { order: 1; font: 800 1.5rem/1 var(--f-d); font-stretch: 80%; color: var(--fg); } .tl-t { order: 3; font-size: .85rem; line-height: 1.2; max-width: 14ch; }
.tl-dot.past::before { background: var(--mute); } .tl-dot[aria-selected=true]::before { background: var(--hc, var(--o)); border-color: var(--hc, var(--o)); box-shadow: 0 0 0 6px color-mix(in oklab, var(--hc, var(--o)) 28%, transparent); width: 20px; height: 20px; margin: 5px 0 7px -2px; } .tl-dot[aria-selected=true] { color: var(--fg); }
.tl-dot[data-tone=bad]::before { border-color: var(--p); } .tl-dot[data-tone=now]::before { border-color: var(--l); }
.tl-panel { margin-top: 8px; padding: 22px; border-radius: 22px; background: var(--card); } .tl-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; } .tl-hy { font: 800 2rem var(--f-d); color: var(--hc, var(--o)); font-stretch: 80%; } .tl-head h4 { font-size: 1.3rem; } .tl-panel > *:last-child { margin-bottom: 0; }
.tl-nav { display: flex; gap: 8px; margin-top: 10px; }

/* ===== fluxo, ciclo, org, rings ===== */
.flow { list-style: none; padding: 0; margin: 0 0 1.2rem; display: flex; flex-wrap: wrap; gap: 10px 0; align-items: stretch; max-width: none; }
.flow-i { display: flex; align-items: center; min-width: 0; } .flow-c { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 18px; background: radial-gradient(100% 100% at 0 0, color-mix(in oklab, var(--hc, var(--b)) 20%, transparent), transparent 75%), var(--card); border: 1px solid var(--line); max-width: 250px; min-width: 120px; height: 100%; } .flow-c strong { font: 700 1rem/1.15 var(--f-d); } .flow-c span { font-size: .85rem; color: var(--mute); line-height: 1.3; }
.flow-a { padding: 0 8px; color: var(--mute); display: grid; place-items: center; }
.cycle-w { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 24px; align-items: center; } .cycle { width: 100%; height: auto; overflow: visible; }
.cy-arc { fill: none; stroke: var(--mute); stroke-width: 2; color: var(--mute); stroke-dasharray: 2 5; stroke-linecap: round; }
.cy-n { cursor: pointer; } .cy-n circle { fill: color-mix(in oklab, var(--hc, var(--b)) 24%, var(--bg)); stroke: var(--line); stroke-width: 1.5; transition: .25s; } .cy-n:hover circle { stroke: var(--fg); } .cy-n.on circle { fill: color-mix(in oklab, var(--o) calc(60% * var(--mxl)), var(--bg)); stroke: var(--fg); } .cy-n text { font: 700 13px var(--f-d); fill: var(--fg); pointer-events: none; } .cy-n.on text { fill: var(--cell-fg); }
.cy-info { padding: 20px; border-radius: 20px; background: var(--card); min-height: 120px; } .cy-info strong { font: 700 1.25rem var(--f-d); display: block; margin-bottom: 6px; }
.org-w { overflow-x: auto; padding: 4px 4px 14px; max-width: none; } .org, .org ul { list-style: none; margin: 0; padding: 0; } .org { width: max-content; min-width: 100%; display: flex; justify-content: center; }
.org ul { display: flex; justify-content: center; padding-top: 24px; position: relative; } .org li { position: relative; padding: 24px 5px 0; display: flex; flex-direction: column; align-items: center; }
.org li::before, .org li::after { content: ""; position: absolute; top: 0; right: 50%; width: 50%; height: 24px; border-top: 1.5px solid var(--mute); } .org li::after { right: auto; left: 50%; border-left: 1.5px solid var(--mute); }
.org li:only-child::before, .org li:only-child::after { display: none; } .org li:only-child { padding-top: 0; } .org li:first-child::before, .org li:last-child::after { border: 0; } .org li:last-child::before { border-right: 1.5px solid var(--mute); border-radius: 0 10px 0 0; } .org li:first-child::after { border-radius: 10px 0 0 0; }
.org ul::before { content: ""; position: absolute; top: 0; left: 50%; border-left: 1.5px solid var(--mute); height: 24px; } .org > li { padding-top: 0; } .org > li::before, .org > li::after { display: none; }
.org-n { display: flex; flex-direction: column; gap: 4px; width: 148px; padding: 12px 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-align: center; } .org-n strong { font: 700 .98rem/1.15 var(--f-d); } .org-n span { font-size: .8rem; color: var(--mute); line-height: 1.3; }
.org-n.strong { background: color-mix(in oklab, var(--o) calc(56% * var(--mxl)), var(--bg)); color: var(--cell-fg); } .org-n.strong span { color: inherit; opacity: .85; } .org-n.alt { background: color-mix(in oklab, var(--b) calc(50% * var(--mxl)), var(--bg)); color: var(--cell-fg); } .org-n.alt span { color: inherit; opacity: .85; }
.rings-w { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 24px; align-items: center; } .rings { width: 100%; height: auto; }
.ring { cursor: pointer; } .ring circle { fill: color-mix(in oklab, var(--b) 10%, transparent); stroke: var(--mute); stroke-width: 1.5; transition: .25s; } .ring:hover circle { stroke: var(--fg); } .ring.on circle { fill: color-mix(in oklab, var(--b) 36%, transparent); stroke: var(--fg); } .ring text { font: 700 12px var(--f-d); fill: var(--fg); pointer-events: none; }
.rings-out { padding: 20px; border-radius: 20px; background: var(--card); } .rings-out strong { font: 700 1.2rem var(--f-d); }
.ruler { position: relative; height: 150px; margin: 34px 10px 12px; max-width: none; } .ruler-line { position: absolute; left: 0; right: 0; top: 44px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--o), var(--p), var(--l)); }
.ruler-t { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; text-align: center; width: 110px; font-size: .82rem; line-height: 1.2; } .ruler-t::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 3px solid var(--fg); margin-top: 6px; } .ruler-t b { font: 800 1.4rem var(--f-d); } .ruler-t.dn { top: 62px; flex-direction: column-reverse; } .ruler-t.dn::after { margin: 0 0 6px; } .ruler-t.now::after { background: var(--l); border-color: var(--l); box-shadow: 0 0 0 6px color-mix(in oklab, var(--l) 30%, transparent); }
.ruler-t:first-of-type { transform: translateX(-10%); } .ruler-t:last-of-type { transform: translateX(-90%); }

/* ===== comparações, tensões ===== */
.cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; max-width: none; } .cmp-c { padding: 20px; border-radius: 22px; background: radial-gradient(100% 90% at 0 0, color-mix(in oklab, var(--hc, var(--fg)) 22%, transparent), transparent 72%), var(--card); min-width: 0; } .cmp-c h4 { font-size: 1.15rem; margin-bottom: 4px; } .cmp-s { color: var(--hc); font-weight: 600; margin-bottom: 8px; } .cmp-c ul { margin: 8px 0 0; padding-left: 1.1em; display: grid; gap: .4em; } .cmp-c ul:has(li:only-child) { list-style: none; padding: 0; }
.tens { display: grid; gap: 10px; max-width: none; } .tens-r { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 14px 16px; border-radius: 18px; background: var(--card); transition: background .2s; } .tens-r:hover, .tens-r:focus { background: var(--card2); }

.tens-d { grid-column: 1 / -1; margin: 4px 0 0; font-size: .92rem; color: var(--mute); }
